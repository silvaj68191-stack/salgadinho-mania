<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Salgadinho Mania</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    rgba(170, 125, 20, 0.20),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #050505,
                    #151108
                );

            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;

            display: flex;

            background: #090909;

            border: 1px solid rgba(205, 157, 35, 0.3);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .apresentacao {
            flex: 1;

            padding: 60px 45px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #0a0a0a,
                    #191506
                );
        }

        .apresentacao h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .apresentacao h1 span {
            color: #c99a24;
        }

        .apresentacao p {
            color: #999;
            line-height: 1.7;
            font-size: 16px;
        }

        .login {
            width: 400px;

            padding: 60px 45px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login > p {
            color: #777;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border-radius: 8px;

            border: 1px solid #4d3c13;

            background: #111;

            color: white;

            outline: none;

            font-size: 15px;
        }

        .campo input:focus {
            border-color: #c99a24;
        }

        .btn-entrar {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #705515,
                    #c09521
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-entrar:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .login {
                width: 100%;
            }

            .apresentacao {
                padding: 40px 30px;
            }

            .login {
                padding: 40px 30px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="apresentacao">

            <h1>
                SALGADINHO <span>MANIA</span>
            </h1>

            <p>
                Bem-vindo ao Salgadinho Mania!
                Entre com seu nome para continuar
                e fazer seu pedido.
            </p>

        </div>


        <div class="login">

            <h2>Entrar</h2>

            <p>
                Digite seu nome para continuar.
            </p>


            <form
                id="loginForm"
                action="salvar.php"
                method="POST"
            >

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-entrar"
                >
                    Entrar
                </button>

            </form>

        </div>

    </div>


    <script>

        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function(event) {

            const nome =
                document.getElementById("nome").value.trim();

            if (nome !== "") {

                /*
                 * Guarda o nome para o pedido.html
                 */
                localStorage.setItem(
                    "nomeUsuario",
                    nome
                );

            }

        });

    </script>

</body>

</html>
